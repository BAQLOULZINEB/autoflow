<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Séquence scénario ambigu avec remise">
 <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79d8d2"/></marker><style>.h{font:700 24px Arial;fill:#fffdf7}.t{font:400 18px Arial;fill:#c2d3dc}.s{font:600 16px Arial;fill:#99d9d5}.m{font:500 15px Arial;fill:#effcfb}.n{font:700 15px Arial;fill:#b8f4ed}.line{stroke:#4b6d7c;stroke-width:2;stroke-dasharray:8 7}.msg{stroke:#79d8d2;stroke-width:3;marker-end:url(#arr)}.human{stroke:#f6b65b;stroke-width:3;marker-end:url(#arr)}</style></defs>
 <rect width="1600" height="1080" fill="#0b2434"/><text x="78" y="82" class="h">Scénario C — dates ambiguës et demande de remise</text><text x="78" y="115" class="t">Deux interruptions rendent la décision commerciale explicite et traçable.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="File de validation AutoFlow">
 <defs><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/></filter><style>.h{font:700 34px Arial;fill:#fffdf7}.sub{font:400 19px Arial;fill:#b7cbd4}.nav{font:700 17px Arial;fill:#d9f5f1}.title{font:700 21px Arial;fill:#112b3d}.txt{font:400 16px Arial;fill:#527080}.small{font:600 14px Arial;fill:#527080}.tag{font:700 13px Arial;fill:#fff}.btn{font:700 15px Arial;fill:#fff}</style></defs>
 <rect width="1600" height="900" fill="#0b2434"/><text x="76" y="74" class="h">File à valider — vue de supervision</text><text x="76" y="108" class="sub">Schéma fidèle au parcours administratif : chaque demande sensible est affectée, expliquée et décidée.</text>
 <g filter="url(#sh)"><rect x="76" y="150" width="1448" height="670" rx="24" fill="#f8fafc"/><rect x="76" y="150" width="270" height="670" rx="24" fill="#102b40"/><rect x="76" y="190" width="270" height="630" fill="#102b40"/>
  <text x="112" y="205" class="h" font-size="25">AutoFlow <tspan fill="#32c5b8">Pro</tspan></text><text x="112" y="236" class="sub" font-size="14">Workflow supervisé</text>
  <g class="nav"><text x="112" y="310">TABLEAU DE BORD</text><text x="112" y="366">À TRAITER</text><rect x="98" y="388" width="226" height="52" rx="12" fill="#174b64"/><text x="122" y="421">FILE À VALIDER</text><text x="112" y="485">SUIVI EN DIRECT</text><text x="112" y="541">SIMULATIONS</text><text x="112" y="597">ARCHITECTURE</text></g>
  <text x="390" y="215" class="title" font-size="31">File à valider</text><text x="390" y="247" class="txt">Les décisions attendent une personne, jamais un envoi automatique.</text>
  <rect x="390" y="278" width="160" height="42" rx="12" fill="#0d9f98"/><text x="470" y="305" text-anchor="middle" class="btn">ÉQUIPE · 4</text><rect x="565" y="278" width="170" height="42" rx="12" fill="#edf4f7" stroke="#b7cbd4"/><text x="650" y="305" text-anchor="middle" class="small">MANAGER · 2</text>
  <g><rect x="390" y="350" width="1088" height="108" rx="16" fill="#fff" stroke="#d7e2e8"/><rect x="414" y="373" width="78" height="28" rx="14" fill="#ffe2b3"/><text x="453" y="393" text-anchor="middle" class="small" fill="#7a4d05">ÉLEVÉE</text><text x="516" y="388" class="title">A-0003 · Demande ambiguë + remise</text><text x="516" y="417" class="txt">Dates à compléter ; proposition de remise à valider par le manager.</text><rect x="1258" y="375" width="95" height="36" rx="10" fill="#0d9f98"/><text x="1306" y="398" text-anchor="middle" class="btn">OUVRIR</text><rect x="1363" y="375" width="90" height="36" rx="10" fill="#eff4f7"/><text x="1408" y="398" text-anchor="middle" class="small">TRACER</text></g>
  <g><rect x="390" y="478" width="1088" height="108" rx="16" fill="#fff" stroke="#d7e2e8"/><rect x="414" y="501" width="82" height="28" rx="14" fill="#d9f4ec"/><text x="455" y="521" text-anchor="middle" class="small" fill="#176c59">ÉQUIPE</text><text x="516" y="516" class="title">A-0008 · Alternative disponible</text><text x="516" y="545" class="txt">Le véhicule demandé est indisponible ; deux alternatives sont expliquées.</text><rect x="1258" y="503" width="95" height="36" rx="10" fill="#0d9f98"/><text x="1306" y="526" text-anchor="middle" class="btn">OUVRIR</text><rect x="1363" y="503" width="90" height="36" rx="10" fill="#eff4f7"/><text x="1408" y="526" text-anchor="middle" class="small">TRACER</text></g>
  <g><rect x="390" y="606" width="1088" height="108" rx="16" fill="#fff" stroke="#d7e2e8"/><rect x="414" y="629" width="94" height="28" rx="14" fill="#f7d9d5"/><text x="461" y="649" text-anchor="middle" class="small" fill="#994039">URGENTE</text><text x="526" y="644" class="title">A-0011 · Réclamation client</text><text x="526" y="673" class="txt">Aucun brouillon envoyé ; priorisation et escalade immédiate.</text><rect x="1258" y="631" width="95" height="36" rx="10" fill="#0d9f98"/><text x="1306" y="654" text-anchor="middle" class="btn">OUVRIR</text><rect x="1363" y="631" width="90" height="36" rx="10" fill="#eff4f7"/><text x="1408" y="654" text-anchor="middle" class="small">TRACER</text></g>
  <rect x="390" y="747" width="1088" height="50" rx="13" fill="#e6f7f4"/><text x="414" y="778" class="small" fill="#0d746d">Chaque décision devient un évènement : acteur, motif, date et état suivant.</text>
 </g>
